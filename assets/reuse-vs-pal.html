function tok(name) { return name.replace(/[^A-Za-z0-9._~-]/g, "."); }

function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function hexRgb(h) { h = h.replace("#", ""); return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16)); }
function mix(a, b, t) { return a.map((v, i) => Math.round(v + (b[i] - v) * t)); }
function unitColour(u) {
  const none = hexRgb(css("--none")), part = hexRgb(css("--part")), match = hexRgb(css("--match"));
  if (u.c > 0 && u.m >= u.c) return match;
  if (u.f <= 0) return none;
  return mix(none, part, 0.35 + 0.65 * Math.pow(u.f / 100, 3));
}
function fnColour(f) {
  if (f >= 100) return css("--match");
  if (f <= 0) return css("--none");
  return css("--part");
}

// --- squarified treemap -------------------------------------------------
function worst(row, side) {
  let s = 0, big = 0, small = Infinity;
  for (const r of row) { s += r.a; big = Math.max(big, r.a); small = Math.min(small, r.a); }
  return Math.max((side * side * big) / (s * s), (s * s) / (side * side * small));
}
function layoutRow(row, rect, out) {
  const s = row.reduce((t, r) => t + r.a, 0);
  let { x, y, w, h } = rect;
  if (w >= h) {
    const cw = s / h; let cy = y;
    for (const r of row) { const ch = r.a / cw; out.push({ item: r.item, x, y: cy, w: cw, h: ch }); cy += ch; }
    return { x: x + cw, y, w: w - cw, h };
  }
  const rh = s / w; let cx = x;
  for (const r of row) { const cw = r.a / rh; out.push({ item: r.item, x: cx, y, w: cw, h: rh }); cx += cw; }
  return { x, y: y + rh, w, h: h - rh };
}
function squarify(items, x, y, w, h) {
  const total = items.reduce((t, i) => t + i.v, 0);
  const out = [];
  if (total <= 0 || w <= 0 || h <= 0) return out;
  const scale = (w * h) / total;
  const rest = items.filter((i) => i.v > 0).map((i) => ({ a: i.v * scale, item: i.item })).sort((p, q) => q.a - p.a);
  let row = [], rect = { x, y, w, h };
  while (rest.length) {
    const side = Math.min(rect.w, rect.h);
    if (!row.length || worst(row.concat([rest[0]]), side) <= worst(row, side)) row.push(rest.shift());
    else { rect = layoutRow(row, rect, out); row = []; }
  }
  if (row.length) layoutRow(row, rect, out);
  return out;
}

const tree = new Map();

  if (u.c <= 0) continue;
  if (!tree.has(u.cat)) tree.set(u.cat, new Map());
  const folders = tree.get(u.cat);
  const dir = u.p.includes("/") ? u.p.slice(0, u.p.lastIndexOf("/")) : "";
  if (!folders.has(dir)) folders.set(dir, []);
  folders.get(dir).push(u);
}

    const folders = tree.get(c.item);
    const fitems = [...folders.entries()].map(([dir, us]) => ({ v: sum(us), item: dir }));
    for (const f of squarify(fitems, c.x, c.y, c.w, c.h)) {
      for (const r of squarify(folders.get(f.item).map((u) => ({ v: u.c, item: u })), f.x, f.y, f.w, f.h)) rects.push(r);
    }
  }
  draw();
}

function draw() {
  const box = $("map").getBoundingClientRect();
  ctx.fillStyle = css("--map-bg");
  ctx.fillRect(0, 0, box.width, box.height);
  for (const r of rects) {
    const [cr, cg, cb] = unitColour(r.item);
    ctx.fillStyle = `rgb(${cr},${cg},${cb})`;
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = "rgba(0,0,0,0.75)"; ctx.lineWidth = 0.6;
    ctx.strokeRect(r.x, r.y, r.w, r.h);
  }
  ctx.lineWidth = 2; ctx.strokeStyle = "#000";
  for (const g of groups) ctx.strokeRect(g.x, g.y, g.w, g.h);
  for (const r of [hover, selected]) {
    if (!r) continue;
    ctx.lineWidth = r === selected ? 3 : 2;
    ctx.strokeStyle = r === selected ? css("--sel") : "#fff";
    ctx.strokeRect(r.x + 1, r.y + 1, Math.max(r.w - 2, 1), Math.max(r.h - 2, 1));
  }
  // category labels
  ctx.font = `700 12px ${css("--font-display")}`;
  ctx.textBaseline = "top";
  for (const g of groups) {
    if (g.w < 90 || g.h < 30) continue;
    const label = g.name;
    const tw = ctx.measureText(label).width;
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(g.x + 6, g.y + 6, tw + 10, 18);
    ctx.fillStyle = "#fff";
    ctx.fillText(label, g.x + 11, g.y + 9);
  }
}

function hit(ev) {
  const b = cv.getBoundingClientRect();
  const x = ev.clientX - b.left, y = ev.clientY - b.top;
  for (const r of rects) if (x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h) return { r, x, y };
  return null;
}

cv.addEventListener("mousemove", (ev) => {
  const h = hit(ev);
  const tip = $("tip");
  if (!h) { hover = null; tip.hidden = true; draw(); return; }
  if (hover !== h.r) { hover = h.r; draw(); }
  const u = h.r.item;
  tip.innerHTML = `<b>${esc(u.n)}</b><br>${pct(u.m / u.c * 100)} identical · ${pct(u.f)} incl. masked · ${kb(u.c)}`;
  tip.hidden = false;
  const mb = $("map").getBoundingClientRect();
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  tip.style.left = Math.min(h.x + 14, mb.width - tw - 6) + "px";
  tip.style.top = (h.y + 14 + th > mb.height ? h.y - th - 10 : h.y + 14) + "px";
});
cv.addEventListener("mouseleave", () => { hover = null; $("tip").hidden = true; draw(); });
cv.addEventListener("click", (ev) => { const h = hit(ev); if (h) select(h.r.item, true); });

function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }

function select(u, scroll) {
  selected = rects.find((r) => r.item === u) || null;
  draw();
  try { history.replaceState(null, "", "#" + tok(u.n)); } catch (e) {}
  const matchedFns = u.fn.filter((f) => f[2] >= 100).length;
  const status = u.c > 0 && u.m >= u.c ? ["All bytes identical", "--match"] : u.f <= 0 ? ["Changed / not paired", "--none"] : ["Mixed comparison results", "--part"];
  const rows = u.fn.map((f) => `<tr><td class="fn">${esc(f[0])}</td><td class="num">${f[1]}</td>`
    + `<td class="num">${f[2] === 100 ? "Byte-identical" : f[2] === 99 ? "Relocation-masked candidate" : f[2] < 0 ? "Not paired" : "Changed"}</td>`
    + `<td><div class="bar"><i style="width:${Math.max(0, f[2])}%;background:${fnColour(f[2])}"></i></div></td></tr>`).join("");
  $("detail").innerHTML = `
    <div class="dhead">
      <h2>${esc(u.p)}</h2>
      <a href="${REPO}/blob/main/${encodeURI(u.p)}" target="_blank" rel="noopener">Open source on GitHub ↗</a>
    </div>
    <div class="dstats">
      <span class="pill" style="background:var(${status[1]})">${status[0]}</span>
      <span><b>${pct(u.m / u.c * 100)}</b> byte-identical code</span>
      <span><b>${pct(u.f)}</b> incl. masked</span>
      <span><b>${matchedFns} / ${u.fn.length}</b> functions byte-identical</span>
      <span><b>${kb(u.c)}</b> of code</span>
    </div>
    <div class="fnwrap"><table>
      <thead><tr><th>Function</th><th class="num">Bytes</th><th class="num">Comparison</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
  if (scroll) $("detail").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
}

function header() {
  const t = DATA.total;
  $("sub").textContent = `Super Mario Sunshine (JP 1.0; GMSJ01) · ${t.units} source files · built ${DATA.built}`;
  const items = [
    [pct(t.matched), "byte-identical code"],
    [pct(t.fuzzy), "incl. masked candidates"],
    [`${t.mfn.toLocaleString()} / ${t.fns.toLocaleString()}`, "functions byte-identical"],
    [`${t.done} / ${t.units}`, "files byte-identical"],
  ];
  $("stats").innerHTML = items.map(([v, l]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");
  $("foot").textContent = "Byte-weighted named-function comparison against PAL. Green = exact linked bytes. Blue = candidate with identical bytes outside relocation fields and identical relocation positions/types. Relocation targets and referenced data may differ; blue is not proven equivalent. Changed and unpaired functions remain distinct in the list. Coverage: 99.7641% of executable code bytes.";
}

// search
const q = $("q"), results = $("results");
q.addEventListener("input", () => {
  const s = q.value.trim().toLowerCase();
  if (!s) { results.hidden = true; return; }
  const hits = units.filter((u) => u.c > 0 && u.n.toLowerCase().includes(s)).slice(0, 30);
  results.innerHTML = hits.length ? hits.map((u, i) => `<li><button type="button" data-i="${units.indexOf(u)}">${esc(u.n)}<small>${pct(u.f)}</small></button></li>`).join("")
    : `<li style="padding:6px 8px;color:var(--muted)">No file matches “${esc(q.value)}”.</li>`;
  results.hidden = false;
});
results.addEventListener("click", (ev) => {
  const b = ev.target.closest("button"); if (!b) return;
  select(units[+b.dataset.i], true); results.hidden = true; q.value = "";
});
document.addEventListener("click", (ev) => { if (!ev.target.closest(".search")) results.hidden = true; });

header();
layout();
new ResizeObserver(() => layout()).observe($("map"));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

const start = location.hash.slice(1);
const initial = units.find((u) => tok(u.n) === start) || units.find((u) => u.n === "Enemy/koopajr") || units.find((u) => u.c > 0);
select(initial, false);
</script>
